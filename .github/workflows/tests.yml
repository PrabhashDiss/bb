name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 22.19.0
  PNPM_VERSION: 9.15.0
  BUN_VERSION: 1.3.14

jobs:
  plan:
    name: Plan test shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: shards
        run: |
          echo "matrix=$(node -p 'JSON.stringify({ include: require("./scripts/ci-test-shards.json").tests })')" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: test-${{ matrix.shard }}

      - if: ${{ startsWith(matrix.shard, 'packages-') || startsWith(matrix.shard, 'plugins-') }}
        uses: ./.github/actions/setup-bun
        with:
          version: ${{ env.BUN_VERSION }}

      - if: ${{ contains(matrix.filter, '--filter=@bb/desktop') }}
        run: bash .github/actions/setup-workspace/install-electron-libraries.sh

      - name: Test
        env:
          BB_CI_TEST_SHARD: ${{ matrix.vitestShard }}
          VITEST_MAX_WORKERS: ${{ (startsWith(matrix.shard, 'server-') || matrix.shard == 'integration') && '4' || '2' }}
        run: ${{ contains(matrix.filter, '--filter=@bb/desktop') && 'xvfb-run -a' || '' }} pnpm exec turbo run test ${{ matrix.filter }} --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only --concurrency=4
