# Builds the Linux release artifacts for this fork and publishes them as a
# GitHub release the dotfiles package manifests install from:
#   - bb-<version>-x86_64.AppImage  (setup/packages/appimage.sh)
#   - bb-app-<version>.tgz          (setup/packages/npm.sh)
# macOS packaging, signing, notarization and the desktop auto-update feeds are
# deliberately not built here: this fork installs on Linux only.
name: Build Desktop

on:
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 release
    # Pinned rather than ubuntu-latest so the glibc the AppImage links against
    # changes only when we choose it: the build machine's glibc sets the
    # minimum distro version users need.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install AppImage FUSE runtime
        uses: ./.github/actions/install-appimage-fuse
        timeout-minutes: 5

      - name: Read version
        run: |
          VERSION="$(node -p 'require("./packages/bb-app/package.json").version')"
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          echo "TAG=bb-v$VERSION" >>"$GITHUB_ENV"
          mkdir -p release

      - name: Build desktop and launcher
        run: pnpm exec turbo run build --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Pack bb-app tarball
        working-directory: packages/bb-app
        run: npm pack --pack-destination "$GITHUB_WORKSPACE/release"

      - name: Package x64 AppImage
        run: pnpm exec turbo run desktop:build:linux --filter=@bb/desktop --output-logs=new-only

      - name: Collect release assets
        run: |
          cp apps/desktop/release/*.AppImage release/
          ls -l release/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" release/* \
            --title "bb $VERSION" \
            --notes "Linux build of $GITHUB_SHA."

      - name: Summarize
        run: |
          {
            echo "## bb $VERSION ($TAG)"
            echo
            echo 'Update the dotfiles manifests with these checksums:'
            echo
            echo '```'
            sha256sum release/*
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
